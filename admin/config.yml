backend:
  name: github
  repo: pantanocode89/Alpenchalets-Flachauer-Gutshof
  branch: main
  base_url: https://alpenchalets-cms-auth.draganaimilospantic.workers.dev
  auth_endpoint: auth

media_folder: assets/images
public_folder: /assets/images
site_url: https://www.alpenchalets.at
display_url: https://www.alpenchalets.at
locale: de

collections:
  - name: seiten
    label: Seiteninhalte
    files:
      - label: Startseite
        name: home
        file: content/home.json
        fields:
          - &title {label: Interner Seitentitel, name: title, widget: hidden}
          - &texts
            label: Inhalte und Texte
            name: texts
            widget: list
            summary: "{{fields.label}}"
            fields:
              - {label: ID, name: id, widget: hidden}
              - {label: Interne Bezeichnung, name: label, widget: hidden}
              - {label: Deutsch, name: de, widget: text}
              - {label: English, name: en, widget: text}
          - &translations
            label: Überschriften und Schaltflächen dieser Seite
            name: translations
            widget: list
            summary: "{{fields.label}}"
            fields:
              - {label: ID, name: id, widget: hidden}
              - {label: Interne Bezeichnung, name: label, widget: hidden}
              - {label: Deutsch, name: de, widget: text}
              - {label: English, name: en, widget: text}
          - &media
            label: Bilder auf dieser Seite
            name: media
            widget: list
            summary: "{{fields.label}}"
            fields:
              - {label: ID, name: id, widget: hidden}
              - {label: Interne Bezeichnung, name: label, widget: hidden}
              - {label: Bild ersetzen, name: image, widget: image, required: true}
          - &heroes
            label: Seitenkopf
            name: heroes
            widget: object
            fields:
              - {label: Sommer – Headerbild, name: summer, widget: image, required: true}
              - {label: Winter – Headerbild, name: winter, widget: image, required: true}
          - &links
            label: Inhaltliche Links dieser Seite
            name: links
            widget: list
            summary: "{{fields.label}}"
            fields:
              - {label: ID, name: id, widget: hidden}
              - {label: Interne Bezeichnung, name: label, widget: hidden}
              - {label: URL, name: url, widget: string, pattern: ['https?://.+', 'Bitte eine vollständige https://-Adresse eingeben.']}
          - label: 4-Zimmer-Chalet – Bilder
            name: chalet4_gallery
            widget: object
            fields: &gallery_with_floorplan
              - {label: ID, name: id, widget: hidden}
              - {label: Grundriss, name: floorplan, widget: image, required: false}
              - label: Bilder
                name: images
                widget: list
                min: 1
                field: {label: Bild, name: image, widget: image}
          - label: 5-Zimmer-Chalet – Bilder
            name: chalet5_gallery
            widget: object
            fields: *gallery_with_floorplan
      - label: 4-Zimmer-Chalet
        name: chalet4
        file: content/chalet-4.json
        fields:
          - *title
          - *texts
          - *translations
          - *media
          - *heroes
          - *links
          - &main_gallery
            label: Hauptgalerie
            name: gallery
            widget: object
            fields: &gallery_images
              - {label: ID, name: id, widget: hidden}
              - label: Bilder
                name: images
                widget: list
                min: 1
                field: {label: Bild, name: image, widget: image}
      - label: 5-Zimmer-Chalet
        name: chalet5
        file: content/chalet-5.json
        fields: [*title, *texts, *translations, *media, *heroes, *links, *main_gallery]
      - label: Sommer
        name: sommer
        file: content/sommer.json
        fields: [*title, *texts, *translations, *media, *heroes, *links, &slideshow {label: Header-Slideshow, name: gallery, widget: object, fields: *gallery_images}]
      - label: Winter
        name: winter
        file: content/winter.json
        fields: [*title, *texts, *translations, *media, *heroes, *links, *slideshow]
      - label: Restaurant / Flachauer Gutshof
        name: restaurant
        file: content/restaurant.json
        fields: [*title, *texts, *translations, *media, *heroes, *links, *slideshow]
      - label: Lage & Anfahrt
        name: lage
        file: content/lage.json
        fields: [*title, *texts, *translations, *media, *heroes, *links]
      - label: Galerie
        name: galerie
        file: content/galerie.json
        fields:
          - *title
          - label: Texte
            name: texts
            widget: object
            fields:
              - {label: Hauptüberschrift – Deutsch, name: heading_de, widget: text}
              - {label: Hauptüberschrift – English, name: heading_en, widget: text}
              - {label: Untertitel – Deutsch, name: subtitle_de, widget: text}
              - {label: Untertitel – English, name: subtitle_en, widget: text}
          - label: Hauptgalerie
            name: main_gallery
            widget: object
            fields:
              - {label: ID, name: id, widget: hidden}
              - label: Bilder
                name: images
                widget: list
                min: 1
                field: {label: Bild, name: image, widget: image}
          - *heroes
      - label: FAQ
        name: faq
        file: content/faq.json
        fields:
          - *title
          - *texts
          - *translations
          - *media
          - *heroes
          - *links
          - &faqs
            label: FAQ – Fragen und Antworten dieser Seite
            name: faqs
            widget: list
            summary: "{{fields.question_de}}"
            fields:
              - {label: Frage Deutsch, name: question_de, widget: text}
              - {label: Antwort Deutsch, name: answer_de, widget: text}
              - {label: Question English, name: question_en, widget: text}
              - {label: Answer English, name: answer_en, widget: text}
      - {label: Kontakt, name: kontakt, file: content/kontakt.json, fields: [*title, *texts, *translations, *media, *heroes, *links]}
      - {label: Urlaubsanfrage, name: urlaubsanfrage, file: content/urlaubsanfrage.json, fields: [*title, *texts, *translations, *media, *heroes, *links]}
      - {label: Impressum, name: impressum, file: content/impressum.json, fields: [*title, *texts, *translations, *media, *heroes, *links]}
      - {label: Datenschutz, name: datenschutz, file: content/datenschutz.json, fields: [*title, *texts, *translations, *media, *heroes, *links]}
  - name: global
    label: Globale Inhalte
    files:
      - label: Kontakt und Standort
        name: global
        file: content/global.json
        fields:
          - {label: Interner Titel, name: title, widget: hidden}
          - label: Kontaktangaben
            name: contact
            widget: object
            fields:
              - {label: Telefon, name: phone, widget: string, required: true}
              - {label: E-Mail, name: email, widget: string, required: true}
              - {label: Adresse, name: address, widget: string, required: true}
